name: Deploy Mami_Docs to Cloudflare Pages

# Workflow MANUAL — rulare prin Actions UI sau `gh workflow run deploy.yml`
# Necesita 4 GitHub secrets configurate in repo settings:
#   - CLOUDFLARE_API_TOKEN
#   - CLOUDFLARE_ACCOUNT_ID
#   - VITE_SUPABASE_URL
#   - VITE_SUPABASE_ANON_KEY
# (VITE_NTFY_TOPIC + VITE_AI_GATEWAY_URL sunt hardcoded sub fiindca sunt URL-uri publice)
#
# Alternativa: build local + wrangler pages deploy via scripts/build-and-deploy.ps1

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      deployments: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build with Vite
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_NTFY_TOPIC: mami-docs-2026-roland
          VITE_AI_GATEWAY_URL: https://mami-docs-ai.petrilarolly.workers.dev
        run: npm run build

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # --commit-message ASCII evită bug CF API cu UTF-8 multi-line (cod 8000111)
          command: pages deploy dist --project-name=mami-docs --branch=main --commit-dirty=true --commit-message="auto-deploy ${{ github.sha }}"

      # T6.4 — Worker AI Gateway deploy cu KV binding pentru rate limit.
      # Tokenul GH secret CLOUDFLARE_API_TOKEN trebuie să aibă scope:
      #   - Account: Workers Scripts:Edit
      #   - Account: Workers KV Storage:Edit
      # Dacă lipsește KV scope, jobul eșuează aici cu cod 10023 — admin upgradează tokenul.
      - name: Deploy AI Gateway worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: workers/ai-gateway
          command: deploy
