name = "mami-docs-keepalive"
main = "index.ts"
compatibility_date = "2024-09-02"

# T9.1 — observability
[observability]
enabled = true

[triggers]
crons = [
  "0 2 */4 * *",   # keepalive Supabase (la 4 zile)
  "0 2 * * *",     # backup zilnic Supabase → R2
  "30 0 * * *",    # auto-sumar nocturn (00:30 UTC = ~03:30 EET)
  "0 3 * * sun"    # mentenanță săptămânală duminică 03:00 UTC (archive 60d, cleanup invites)
]

[[r2_buckets]]
binding = "MAMI_DOCS_BACKUP"
bucket_name = "mami-docs-backup"

# Secrete (nu se scriu aici — se seteaza via wrangler secret put):
#   SUPABASE_URL, SUPABASE_ANON_KEY, SUPABASE_SERVICE_ROLE_KEY
#   GROQ_API_KEY, NTFY_TOPIC, TELEGRAM_BOT_TOKEN, TELEGRAM_CHAT_ID
#   AI_GATEWAY_URL (optional)
