name = "mami-docs-ai"
main = "index.ts"
compatibility_date = "2024-09-02"

# T9.1 — observability (logs + metrics în CF dashboard)
[observability]
enabled = true

[vars]
# Set to your Cloudflare Pages domain, e.g. "https://mami-docs.pages.dev"
# Empty string = accept any origin (dev mode)
ALLOWED_ORIGIN = "https://mami-docs.pages.dev"

# GROQ_API_KEY must be set via:  wrangler secret put GROQ_API_KEY
# DO NOT add secret values to this file

# T6.4 — Rate limiting per IP (30 req/min via KV counter, TTL 60s).
# Namespace creat 2026-05-06 cu `wrangler kv namespace create RATE_LIMIT_KV`.
# Deploy se face din GitHub Actions (vezi .github/workflows/deploy.yml step "Deploy AI Gateway worker")
# fiindcă tokenul local CF n-are scope „Workers KV Storage:Edit". Codul are graceful fallback:
# KV unbound = no rate limiting, deci dev local (`wrangler dev`) funcționează tot fără KV.
[[kv_namespaces]]
binding = "RATE_LIMIT_KV"
id = "8e9b7ed77f1247398c8d22571238d4d0"
