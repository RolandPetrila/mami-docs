name = "mami-docs-ai"
main = "index.ts"
compatibility_date = "2024-09-02"

[vars]
# Set to your Cloudflare Pages domain, e.g. "https://mami-docs.pages.dev"
# Empty string = accept any origin (dev mode)
ALLOWED_ORIGIN = "https://mami-docs.pages.dev"

# GROQ_API_KEY must be set via:  wrangler secret put GROQ_API_KEY
# DO NOT add secret values to this file

# T6.4 — Rate limiting per IP (30 req/min via KV counter, TTL 60s).
# Namespace creat 2026-05-06 cu `wrangler kv namespace create RATE_LIMIT_KV` (id 8e9b7ed77f1247398c8d22571238d4d0).
# COMENTAT TEMPORAR: tokenul CF actual nu are KV write perm la deploy → activăm prin GH Actions
# sau după ce admin regenerează tokenul cu scope „Workers KV Storage:Edit". Worker continuă fără
# rate limit până atunci (graceful fallback în code: KV unbound = no rate limiting).
# [[kv_namespaces]]
# binding = "RATE_LIMIT_KV"
# id = "8e9b7ed77f1247398c8d22571238d4d0"
